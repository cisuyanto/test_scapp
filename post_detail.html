<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syber Community Post</title>
    <!-- Dynamic Open Graph Meta Tags for LinkedIn Previews -->
    <meta property="og:title" content="<!--OG_TITLE_PLACEHOLDER-->" />
    <meta property="og:description" content="<!--OG_DESC_PLACEHOLDER-->" />
    <meta property="og:url" content="<!--OG_URL_PLACEHOLDER-->" />
    <meta property="og:type" content="article" />
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-link { color: #0066ff; text-decoration: none; font-weight: bold; font-size: 0.9em; }
        .back-link:hover { text-decoration: underline; }

        .profile-widget { display: flex; align-items: center; gap: 8px; background: white; padding: 4px 10px; border-radius: 20px; border: 1px solid #cbd5e1; cursor: pointer; }
        .profile-avatar { width: 24px; height: 24px; border-radius: 50%; background: #e2e8f0; object-fit: cover; }
        .profile-name { font-weight: bold; font-size: 0.8em; color: #334155; }

        .post-card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .post-header { display: flex; justify-content: space-between; font-size: 0.85em; color: #64748b; margin-bottom: 8px; }
        .post-author { font-weight: bold; color: #0f172a; }
        .post-text { font-size: 1.05em; color: #334155; margin-bottom: 16px; white-space: pre-line; line-height: 1.5; }
        .comments-section { background: #f8fafc; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #e2e8f0; }
        .comment-item { font-size: 0.9em; padding: 8px 0; border-bottom: 1px solid #e2e8f0; }
        .comment-item:last-child { border-bottom: none; }
        .comment-author { font-weight: bold; color: #1e293b; }
        .comment-time { font-size: 0.75em; color: #94a3b8; float: right; }
        textarea, button { width: 100%; padding: 10px; margin-top: 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #0066ff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #0052cc; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a class="back-link" href="/">← Back to Main Feed</a>
            <div class="profile-widget" onclick="changeDisplayName()" title="Click to change your account display name">
                <img id="profileAvatar" class="profile-avatar" src="" alt="Avatar">
                <span id="displayUsername" class="profile-name">Executive_User</span>
            </div>
        </div>

        <div class="post-card" id="postCardContainer">
            <p style="text-align:center; color:#94a3b8;">Loading post...</p>
        </div>
    </div>

    <script>
        let currentUsername = localStorage.getItem('syber_username') || 'Executive_User';

        function updateProfileUI() {
            document.getElementById("displayUsername").innerText = currentUsername;
            document.getElementById("profileAvatar").src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(currentUsername)}`;
        }
        updateProfileUI();

        function changeDisplayName() {
            const newName = prompt("Enter your new account display name:", currentUsername);
            if (newName && newName.trim()) {
                currentUsername = newName.trim();
                localStorage.setItem('syber_username', currentUsername);
                updateProfileUI();
            }
        }

        const pathParts = window.location.pathname.split('/');
        const postId = parseInt(pathParts[pathParts.length - 1]);

        const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const socket = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);

        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.type === "INIT_DATA" || data.type === "UPDATE_POSTS") {
                const post = data.posts.find(p => p.id === postId);
                if (post) {
                    renderPostDetail(post);
                } else {
                    document.getElementById("postCardContainer").innerHTML = `
                        <div style="text-align:center; padding: 20px;">
                            <p style="color:#ef4444; font-weight:bold;">This post was cleared due to a server sleep/restart.</p>
                            <a href="/" style="background:#0066ff; color:white; padding:10px 16px; border-radius:6px; text-decoration:none; font-weight:bold; display:inline-block; margin-top:10px;">Return to Main Feed</a>
                        </div>
                    `;
                }
            }
        };

        function submitComment() {
            const text = document.getElementById("commentText").value.trim();
            if (!text) return alert("Comment cannot be empty.");
            socket.send(JSON.stringify({ type: "NEW_COMMENT", post_id: postId, username: currentUsername, text: text }));
            document.getElementById("commentText").value = "";
        }

        function renderPostDetail(post) {
            let commentsHTML = "";
            post.comments.forEach(c => {
                commentsHTML += `
                    <div class="comment-item">
                        <span class="comment-author">${c.username}:</span> ${c.text}
                        <span class="comment-time">${c.timestamp}</span>
                    </div>
                `;
            });
            if (!commentsHTML) {
                commentsHTML = '<p style="font-size:0.85em; color:#94a3b8; margin:4px 0;">No comments yet.</p>';
            }

            // Static UTC+8 timestamp displayed here
            document.getElementById("postCardContainer").innerHTML = `
                <div class="post-header">
                    <span class="post-author">${post.username}</span>
                    <span>🕒 ${post.timestamp}</span>
                </div>
                <div class="post-text">${post.text}</div>
                
                <div class="comments-section">
                    <b>Discussion (${post.comments.length}):</b>
                    <div id="commentsList">${commentsHTML}</div>
                    <div style="margin-top: 12px;">
                        <textarea id="commentText" rows="2" placeholder="Write a response..."></textarea>
                        <button onclick="submitComment()">Post Reply</button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
